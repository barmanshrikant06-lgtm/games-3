
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World City Game</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial;background:#87ceeb}
#hud{
 position:fixed;top:15px;left:15px;
 color:white;background:#111c;
 padding:15px;border-radius:12px;
 z-index:10;line-height:1.8;
}
#help{
 position:fixed;bottom:15px;left:50%;
 transform:translateX(-50%);
 background:#111d;color:white;
 padding:12px 18px;border-radius:10px;
 text-align:center;z-index:10;
 width:max-content;max-width:95%;
}
#status{color:#55ff88}
</style>
</head>

<body>

<div id="hud">
 <h2>🌆 OPEN WORLD</h2>
 <div>🚗 Vehicle: <span id="vehicle">Walking</span></div>
 <div>⚡ Speed: <span id="speed">0</span> km/h</div>
 <div id="status">Explore the city!</div>
</div>

<div id="help">
 W A S D = Move / Drive |
 E = Enter / Exit Car |
 SHIFT = Boost |
 Mouse = Camera
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,100,350);

const camera = new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,0.1,1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.HemisphereLight(0xffffff,0x667755,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(100,150,80);
sun.castShadow=true;
scene.add(sun);

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x568b45})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// MATERIALS
const roadMat=new THREE.MeshStandardMaterial({color:0x292929});
const lineMat=new THREE.MeshStandardMaterial({color:0xffffff});
const buildingColors=[
 0xcccccc,0xb6b8c1,0xd7c4a6,
 0xaaaabb,0xd2d2d2,0x999999
];

// ROADS
function road(x,z,w,d){
 const r=new THREE.Mesh(
  new THREE.BoxGeometry(w,0.15,d),roadMat
 );
 r.position.set(x,0.05,z);
 r.receiveShadow=true;
 scene.add(r);
}

// City roads
for(let i=-200;i<=200;i+=60){
 road(i,0,14,450);
 road(0,i,450,14);
}

// Road markings
for(let i=-200;i<=200;i+=60){
 for(let j=-210;j<=210;j+=12){
  const a=new THREE.Mesh(
   new THREE.BoxGeometry(0.35,0.03,5),lineMat
  );
  a.position.set(i,0.14,j);
  scene.add(a);

  const b=new THREE.Mesh(
   new THREE.BoxGeometry(5,0.03,0.35),lineMat
  );
  b.position.set(j,0.14,i);
  scene.add(b);
 }
}

// BUILDINGS
function building(x,z,w,h,d,color){
 const group=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:0.85})
 );
 body.position.y=h/2;
 body.castShadow=true;
 body.receiveShadow=true;
 group.add(body);

 // Windows
 const windowMat=new THREE.MeshStandardMaterial({
  color:0x65b8d9,metalness:0.3,roughness:0.2
 });

 for(let y=3;y<h-1;y+=4){
  for(let xx=-w/2+2;xx<w/2-1;xx+=4){
   const win=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1.7,0.15),
    windowMat
   );
   win.position.set(xx,y,d/2+0.08);
   group.add(win);

   const win2=win.clone();
   win2.position.z=-d/2-0.08;
   group.add(win2);
  }
 }

 group.position.set(x,0,z);
 scene.add(group);
}

// Random city buildings
for(let x=-180;x<=180;x+=30){
 for(let z=-180;z<=180;z+=30){
  if(Math.abs(x%60)<12 || Math.abs(z%60)<12)continue;

  let w=12+Math.random()*7;
  let d=12+Math.random()*7;
  let h=12+Math.random()*38;

  building(
   x+(Math.random()-0.5)*4,
   z+(Math.random()-0.5)*4,
   w,h,d,
   buildingColors[Math.floor(Math.random()*buildingColors.length)]
  );
 }
}

// HOUSES
function house(x,z){
 const g=new THREE.Group();

 const wall=new THREE.Mesh(
  new THREE.BoxGeometry(13,7,12),
  new THREE.MeshStandardMaterial({color:0xe6c7a0})
 );
 wall.position.y=3.5;
 wall.castShadow=true;
 g.add(wall);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(10,5,4),
  new THREE.MeshStandardMaterial({color:0x9b4030})
 );
 roof.position.y=9;
 roof.rotation.y=Math.PI/4;
 roof.castShadow=true;
 g.add(roof);

 const door=new THREE.Mesh(
  new THREE.BoxGeometry(2,4,0.2),
  new THREE.MeshStandardMaterial({color:0x57351f})
 );
 door.position.set(0,2,6.1);
 g.add(door);

 const winMat=new THREE.MeshStandardMaterial({color:0x68b8d6});
 for(let a of [-4,4]){
  const win=new THREE.Mesh(
   new THREE.BoxGeometry(2,2,0.2),winMat
  );
  win.position.set(a,4.2,6.1);
  g.add(win);
 }

 g.position.set(x,0,z);
 scene.add(g);
}

// Residential houses
house(40,40);
house(70,40);
house(100,40);
house(-40,40);
house(-70,40);
house(-100,40);

// TREES
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(0.4,0.6,4),
  new THREE.MeshStandardMaterial({color:0x654321})
 );
 trunk.position.set(x,2,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(3,10,10),
  new THREE.MeshStandardMaterial({color:0x176b2c})
 );
 leaves.position.set(x,5,z);
 leaves.castShadow=true;
 scene.add(leaves);
}

for(let i=0;i<100;i++){
 tree(Math.random()*400-200,Math.random()*400-200);
}

// PLAYER
const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(0.65,1.1,4,8),
 new THREE.MeshStandardMaterial({color:0x2455dd})
);
body.position.y=1.2;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.42,16,16),
 new THREE.MeshStandardMaterial({color:0xe2b28a})
);
head.position.y=2.25;
player.add(head);

player.position.set(0,0,8);
scene.add(player);

// CARS
const cars=[];

function makeCar(x,z,color){
 const car=new THREE.Group();

 const base=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,0.8,4.5),
  new THREE.MeshStandardMaterial({color,metalness:0.5,roughness:0.3})
 );
 base.position.y=0.8;
 base.castShadow=true;
 car.add(base);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(1.9,0.9,2.2),
  new THREE.MeshStandardMaterial({color:0x222f3b,metalness:0.4})
 );
 cabin.position.set(0,1.55,-0.2);
 car.add(cabin);

 const wheels=[];
 for(let xx of [-1.3,1.3]){
  for(let zz of [-1.4,1.4]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(0.42,0.42,0.3,16),
    new THREE.MeshStandardMaterial({color:0x111111})
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(xx,0.45,zz);
   car.add(wheel);
   wheels.push(wheel);
  }
 }

 car.position.set(x,0,z);
 scene.add(car);

 cars.push({
  mesh:car,
  wheels,
  speed:0,
  angle:0
 });
}

makeCar(0,15,0xff2222);
makeCar(30,0,0x2266ff);
makeCar(-30,0,0xffffff);
makeCar(0,-30,0x222222);
makeCar(60,0,0xffaa00);

// GAME CONTROLS
const keys={};
let activeCar=null;

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.key.toLowerCase()==='e')toggleCar();
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

function toggleCar(){
 if(activeCar){
  const car=activeCar.mesh;
  player.position.set(
   car.position.x+3,0,car.position.z
  );
  player.visible=true;
  activeCar.speed=0;
  activeCar=null;
  return;
 }

 let nearest=null;
 let dist=5;

 for(const c of cars){
  const d=player.position.distanceTo(c.mesh.position);
  if(d<dist){dist=d;nearest=c;}
 }

 if(nearest){
  activeCar=nearest;
  player.visible=false;
  document.getElementById('status').innerText='Driving!';
 }
}

// CAMERA
let cameraAngle=0;

addEventListener('mousemove',e=>{
 if(document.pointerLockElement===renderer.domElement){
  cameraAngle-=e.movementX*0.003;
 }
});

renderer.domElement.addEventListener('click',()=>{
 renderer.domElement.requestPointerLock();
});

// ANIMATION
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.05);

 let target;
 let yaw=0;

 if(activeCar){
  const car=activeCar;
  const obj=car.mesh;

  if(keys['w'])car.speed+=18*dt;
  if(keys['s'])car.speed-=18*dt;

  car.speed*=Math.pow(0.97,dt*60);
  car.speed=Math.max(-12,Math.min(35,car.speed));

  if(keys['shift'])car.speed=Math.min(car.speed+20*dt,50);

  if(keys['a'])car.angle+=dt*1.5*Math.max(0.3,Math.abs(car.speed)/12);
  if(keys['d'])car.angle-=dt*1.5*Math.max(0.3,Math.abs(car.speed)/12);

  obj.rotation.y=car.angle;

  obj.position.x+=Math.sin(car.angle)*car.speed*dt;
  obj.position.z-=Math.cos(car.angle)*car.speed*dt;

  car.wheels.forEach(w=>{
   w.rotation.x+=car.speed*dt;
  });

  target=obj.position;
  yaw=car.angle;

  document.getElementById('vehicle').innerText='Car';
  document.getElementById('speed').innerText=
   Math.round(Math.abs(car.speed)*3.6);

 }else{
  let move=0;
  let side=0;

  if(keys['w'])move=1;
  if(keys['s'])move=-1;
  if(keys['a'])side=1;
  if(keys['d'])side=-1;

  let angle=cameraAngle;

  const dx=(Math.sin(angle)*move+Math.cos(angle)*side);
  const dz=(-Math.cos(angle)*move+Math.sin(angle)*side);

  const len=Math.hypot(dx,dz);

  if(len>0){
   player.position.x+=dx/len*8*dt;
   player.position.z+=dz/len*8*dt;
   player.rotation.y=Math.atan2(dx,-dz);
  }

  target=player.position;
  yaw=player.rotation.y;

  document.getElementById('vehicle').innerText='Walking';
  document.getElementById('speed').innerText='0';
  document.getElementById('status').innerText='Explore the city!';
 }

 // Follow camera
 const camYaw=activeCar?yaw:cameraAngle;
 const distance=activeCar?12:8;

 const desired=new THREE.Vector3(
  target.x+Math.sin(camYaw)*distance,
  target.y+5,
  target.z+Math.cos(camYaw)*distance
 );

 camera.position.lerp(desired,0.1);

 camera.lookAt(
  target.x,
  target.y+1.5,
  target.z
 );

 renderer.render(scene,camera);
}

camera.position.set(0,8,15);
animate();

// RESIZE
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
