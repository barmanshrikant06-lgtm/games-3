
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D Open World City</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#426b37;font-family:Arial}
canvas{display:block}
#hud{
position:fixed;top:12px;left:12px;
background:#111d;color:white;padding:12px;
border-radius:12px;line-height:1.7;
}
#help{
position:fixed;bottom:12px;left:50%;
transform:translateX(-50%);
color:white;background:#111d;
padding:10px;border-radius:10px;
font-size:12px;text-align:center;
}
#buttons{
position:fixed;bottom:65px;left:15px;
display:grid;grid-template-columns:repeat(3,55px);
gap:5px;
}
button{
width:55px;height:48px;border:0;
border-radius:12px;background:#ffffffcc;
font-size:20px;
}
#enter{
position:fixed;bottom:80px;right:15px;
width:80px;height:60px;background:#ffca28;
font-size:14px;
}
</style>
</head>
<body>

<div id="hud">
<b>🌆 MY OPEN WORLD</b><br>
💰 Money: $5000<br>
🚗 Mode: <span id="mode">Walking</span><br>
⚡ Speed: <span id="speed">0</span>
</div>

<div id="buttons">
<button style="grid-column:2" data-k="w">⬆️</button>
<button data-k="a">⬅️</button>
<button data-k="s">⬇️</button>
<button data-k="d">➡️</button>
</div>
<button id="enter">ENTER 🚗</button>

<div id="help">
WASD / Arrow Keys: Move | E: Enter/Exit Car
</div>

<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
resize();
onresize=resize;

const WORLD=4000;
const TILE=400;

const player={x:2000,y:2000};
const camera={x:0,y:0};
const keys={};
let currentCar=null;

const buildings=[];
const cars=[];
const trees=[];

// City layout
const roadPositions=[];
for(let p=200;p<WORLD;p+=TILE){
 roadPositions.push(p);
}

// Buildings
const buildingColors=[
 "#d6c3a2","#b6bec3","#c7b4a1",
 "#a6a8b8","#e0d8c7","#b3a99c"
];

for(let x=30;x<WORLD;x+=TILE){
 for(let y=30;y<WORLD;y+=TILE){
  for(let i=0;i<3;i++){
   buildings.push({
    x:x+30+Math.random()*220,
    y:y+30+Math.random()*220,
    w:75+Math.random()*75,
    h:75+Math.random()*75,
    color:buildingColors[
     Math.floor(Math.random()*buildingColors.length)
    ]
   });
  }
 }
}

// Trees
for(let i=0;i<500;i++){
 trees.push({
  x:Math.random()*WORLD,
  y:Math.random()*WORLD,
  r:10+Math.random()*8
 });
}

// Cars
const colors=["#ed2525","#1679df","#eeeeee",
"#e7b321","#222222","#19a88a"];

function addCar(x,y,color){
 cars.push({x,y,a:0,speed:0,color});
}
for(let i=0;i<65;i++){
 addCar(
  200+Math.random()*3600,
  200+Math.random()*3600,
  colors[i%colors.length]
 );
}
addCar(2000,2050,"#ff2222");

// Drawing road
function drawRoads(){
 ctx.fillStyle="#353535";
 for(let p of roadPositions){
  ctx.fillRect(p-48,0,96,WORLD);
  ctx.fillRect(0,p-48,WORLD,96);
 }

 ctx.strokeStyle="#eeeeee";
 ctx.lineWidth=3;
 ctx.setLineDash([25,25]);

 for(let p of roadPositions){
  ctx.beginPath();
  ctx.moveTo(p,0);
  ctx.lineTo(p,WORLD);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,p);
  ctx.lineTo(WORLD,p);
  ctx.stroke();
 }
 ctx.setLineDash([]);
}

// Buildings
function drawBuilding(b){
 ctx.fillStyle="#0005";
 ctx.fillRect(b.x+8,b.y+9,b.w,b.h);

 ctx.fillStyle=b.color;
 ctx.fillRect(b.x,b.y,b.w,b.h);

 ctx.fillStyle="#888";
 ctx.fillRect(b.x,b.y,b.w,7);

 ctx.fillStyle="#64b9db";
 for(let xx=b.x+10;xx<b.x+b.w-10;xx+=27){
  for(let yy=b.y+15;yy<b.y+b.h-10;yy+=27){
   ctx.fillRect(xx,yy,13,15);
  }
 }

 ctx.fillStyle="#65452b";
 ctx.fillRect(b.x+b.w/2-8,b.y+b.h-22,16,22);
}

// Houses
function drawHouse(x,y){
 ctx.fillStyle="#a67c52";
 ctx.fillRect(x,y,85,70);
 ctx.fillStyle="#8b3529";
 ctx.beginPath();
 ctx.moveTo(x-10,y);
 ctx.lineTo(x+42,y-30);
 ctx.lineTo(x+95,y);
 ctx.fill();
 ctx.fillStyle="#55351e";
 ctx.fillRect(x+35,y+40,18,30);
}

// Trees
function drawTree(t){
 ctx.fillStyle="#654321";
 ctx.fillRect(t.x-3,t.y,6,12);
 ctx.fillStyle="#17632b";
 ctx.beginPath();
 ctx.arc(t.x,t.y, t.r,0,7);
 ctx.fill();
 ctx.fillStyle="#2d9340";
 ctx.beginPath();
 ctx.arc(t.x-5,t.y-5,t.r*.55,0,7);
 ctx.fill();
}

// Car
function drawCar(c){
 ctx.save();
 ctx.translate(c.x,c.y);
 ctx.rotate(c.a);

 ctx.fillStyle="#111";
 ctx.fillRect(-17,-27,34,54);

 ctx.fillStyle=c.color;
 ctx.fillRect(-14,-24,28,48);

 ctx.fillStyle="#80d4ed";
 ctx.fillRect(-11,-13,22,16);

 ctx.fillStyle="#222";
 ctx.fillRect(-11,8,22,9);

 ctx.fillStyle="#ffe99b";
 ctx.fillRect(-11,-24,7,4);
 ctx.fillRect(4,-24,7,4);

 ctx.fillStyle="#f22";
 ctx.fillRect(-11,20,7,4);
 ctx.fillRect(4,20,7,4);

 ctx.restore();
}

// Player
function drawPlayer(){
 ctx.fillStyle="#0005";
 ctx.beginPath();
 ctx.ellipse(player.x,player.y+6,12,7,0,0,7);
 ctx.fill();

 ctx.fillStyle="#2455ed";
 ctx.fillRect(player.x-9,player.y-8,18,20);

 ctx.fillStyle="#e6ae83";
 ctx.beginPath();
 ctx.arc(player.x,player.y-13,9,0,7);
 ctx.fill();

 ctx.fillStyle="#222";
 ctx.fillRect(player.x-7,player.y-19,14,5);
}

// Controls
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e"&&!e.repeat)toggleCar();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll("[data-k]").forEach(b=>{
 const k=b.dataset.k;
 b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
 b.onpointerup=()=>keys[k]=false;
 b.onpointerleave=()=>keys[k]=false;
 b.onpointercancel=()=>keys[k]=false;
});

document.getElementById("enter").onclick=toggleCar;

function toggleCar(){
 if(currentCar){
  player.x=currentCar.x+45;
  player.y=currentCar.y;
  currentCar.speed=0;
  currentCar=null;
  return;
 }
 let nearest=null;
 let distance=65;
 for(const c of cars){
  let d=Math.hypot(c.x-player.x,c.y-player.y);
  if(d<distance){distance=d;nearest=c;}
 }
 if(nearest)currentCar=nearest;
}

// Collision with buildings
function blocked(x,y){
 for(const b of buildings){
  if(x+9>b.x && x-9<b.x+b.w &&
     y+9>b.y && y-9<b.y+b.h)return true;
 }
 return false;
}

// Update
function update(){
 if(currentCar){
  if(keys.w||keys.arrowup)currentCar.speed+=.3;
  if(keys.s||keys.arrowdown)currentCar.speed-=.3;
  currentCar.speed*=.98;
  currentCar.speed=Math.max(-7,Math.min(12,currentCar.speed));

  if(keys.a||keys.arrowleft)currentCar.a-=.045;
  if(keys.d||keys.arrowright)currentCar.a+=.045;

  let nx=currentCar.x+Math.sin(currentCar.a)*currentCar.speed;
  let ny=currentCar.y-Math.cos(currentCar.a)*currentCar.speed;

  if(!blocked(nx,ny)){
   currentCar.x=nx;
   currentCar.y=ny;
  }else currentCar.speed=0;

  player.x=currentCar.x;
  player.y=currentCar.y;

 }else{
  let dx=0,dy=0;
  if(keys.w||keys.arrowup)dy--;
  if(keys.s||keys.arrowdown)dy++;
  if(keys.a||keys.arrowleft)dx--;
  if(keys.d||keys.arrowright)dx++;

  if(dx||dy){
   const len=Math.hypot(dx,dy);
   dx=dx/len*3.5;
   dy=dy/len*3.5;
   if(!blocked(player.x+dx,player.y))player.x+=dx;
   if(!blocked(player.x,player.y+dy))player.y+=dy;
  }
 }

 player.x=Math.max(10,Math.min(WORLD-10,player.x));
 player.y=Math.max(10,Math.min(WORLD-10,player.y));

 camera.x=player.x-W/2;
 camera.y=player.y-H/2;
 camera.x=Math.max(0,Math.min(WORLD-W,camera.x));
 camera.y=Math.max(0,Math.min(WORLD-H,camera.y));

 document.getElementById("mode").innerText=
 currentCar?"Driving":"Walking";
 document.getElementById("speed").innerText=
 currentCar?Math.round(Math.abs(currentCar.speed)*12):"0";
}

// Render
function render(){
 ctx.fillStyle="#568b46";
 ctx.fillRect(0,0,W,H);

 ctx.save();
 ctx.translate(-camera.x,-camera.y);

 ctx.fillStyle="#568b46";
 ctx.fillRect(0,0,WORLD,WORLD);

 drawRoads();

 for(const t of trees)drawTree(t);
 for(const b of buildings)drawBuilding(b);

 // Houses
 for(let i=0;i<12;i++){
  drawHouse(500+i*250,1000);
 }

 for(const c of cars)drawCar(c);
 if(!currentCar)drawPlayer();

 ctx.restore();

 // Mini map
 const size=145;
 const mx=W-size-15,my=15;
 ctx.fillStyle="#111d";
 ctx.fillRect(mx,my,size,size);
 ctx.fillStyle="#548b46";
 ctx.fillRect(mx+5,my+5,size-10,size-10);

 ctx.strokeStyle="#aaa";
 ctx.lineWidth=3;
 for(let p of roadPositions){
  let xx=mx+5+p/WORLD*(size-10);
  let yy=my+5+p/WORLD*(size-10);
  ctx.beginPath();ctx.moveTo(xx,my+5);
  ctx.lineTo(xx,my+size-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx+5,yy);
  ctx.lineTo(mx+size-5,yy);ctx.stroke();
 }

 ctx.fillStyle="red";
 ctx.beginPath();
 ctx.arc(
  mx+5+player.x/WORLD*(size-10),
  my+5+player.y/WORLD*(size-10),
  4,0,7
 );
 ctx.fill();
}

function gameLoop(){
 update();
 render();
 requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
