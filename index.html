
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA City 2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#222;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
#hud{
position:absolute;top:12px;left:12px;
color:white;background:#111d;padding:13px;
border-radius:10px;line-height:1.7;
pointer-events:none
}
#help{
position:absolute;bottom:12px;left:50%;
transform:translateX(-50%);
background:#111d;color:white;
padding:10px 14px;border-radius:10px;
font-size:13px;text-align:center;
}
#mobile{
position:absolute;bottom:75px;left:15px;
display:none;grid-template-columns:repeat(3,55px);
gap:5px
}
#mobile button,#action{
border:0;border-radius:12px;
background:#ffffffbb;font-size:23px;
width:55px;height:48px
}
#action{
position:absolute;bottom:90px;right:20px;
width:90px;height:60px;font-size:15px;
background:#ffcc33
}
@media(pointer:coarse){
#mobile{display:grid}
#help{bottom:12px;font-size:11px}
}
</style>
</head>
<body>

<div id="hud">
<h3>🌆 GTA CITY 2D</h3>
💰 Money: $5000<br>
🚗 Mode: <span id="mode">Walking</span><br>
⚡ Speed: <span id="speed">0</span><br>
📍 City Explorer
</div>

<div id="help">
W A S D / Arrow Keys = Move |
E = Enter / Exit Car
</div>

<div id="mobile">
<button data-key="w" style="grid-column:2">⬆️</button>
<button data-key="a">⬅️</button>
<button data-key="s">⬇️</button>
<button data-key="d">➡️</button>
</div>
<button id="action">ENTER 🚗</button>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const world={w:2400,h:2400};
const player={x:1200,y:1200,a:0,speed:3};
let car=null;
let camera={x:0,y:0};
let keys={};

const buildings=[];
const trees=[];
const cars=[];

// Roads
const roads=[];
for(let i=200;i<2400;i+=400){
 roads.push({x:i-55,y:0,w:110,h:2400});
 roads.push({x:0,y:i-55,w:2400,h:110});
}

// Buildings
const colors=["#c6b49c","#a9b7bd","#e3c99e",
"#aaa4b5","#d2d2c9","#b5a18b"];

for(let x=30;x<2400;x+=400){
 for(let y=30;y<2400;y+=400){
  if(Math.random()<0.2)continue;
  buildings.push({
   x:x+100+Math.random()*100,
   y:y+100+Math.random()*100,
   w:100+Math.random()*65,
   h:100+Math.random()*65,
   c:colors[Math.floor(Math.random()*colors.length)]
  });
 }
}

// Trees
for(let i=0;i<170;i++){
 trees.push({
  x:Math.random()*2400,
  y:Math.random()*2400,
  r:12+Math.random()*7
 });
}

// Cars
const carColors=["#e53935","#1976d2","#f4c430",
"#eeeeee","#111111","#16a085"];

function createCar(x,y,color){
 cars.push({
  x,y,a:Math.random()*6.28,
  speed:0,color
 });
}
for(let i=0;i<35;i++){
 createCar(
  200+Math.random()*2000,
  200+Math.random()*2000,
  carColors[i%carColors.length]
 );
}
createCar(1200,1250,"#ff2222");

// Draw building
function drawBuilding(b){
 ctx.fillStyle="#0005";
 ctx.fillRect(b.x+7,b.y+8,b.w,b.h);
 ctx.fillStyle=b.c;
 ctx.fillRect(b.x,b.y,b.w,b.h);

 ctx.fillStyle="#777";
 ctx.fillRect(b.x,b.y,b.w,8);

 ctx.fillStyle="#62b8d1";
 for(let x=b.x+12;x<b.x+b.w-8;x+=30){
  for(let y=b.y+20;y<b.y+b.h-8;y+=30){
   ctx.fillRect(x,y,15,18);
  }
 }

 ctx.fillStyle="#66452c";
 ctx.fillRect(b.x+b.w/2-9,b.y+b.h-25,18,25);
}

// Draw car
function drawCar(c){
 ctx.save();
 ctx.translate(c.x,c.y);
 ctx.rotate(c.a);

 ctx.fillStyle="#111";
 ctx.fillRect(-18,-27,36,54);

 ctx.fillStyle=c.color;
 ctx.fillRect(-15,-25,30,50);

 ctx.fillStyle="#8bd6ee";
 ctx.fillRect(-12,-14,24,17);

 ctx.fillStyle="#222";
 ctx.fillRect(-12,8,24,10);

 ctx.fillStyle="#ffffaa";
 ctx.fillRect(-12,-25,8,4);
 ctx.fillRect(4,-25,8,4);

 ctx.fillStyle="#ff2222";
 ctx.fillRect(-12,21,8,4);
 ctx.fillRect(4,21,8,4);

 ctx.restore();
}

// Draw player
function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 ctx.fillStyle="#0005";
 ctx.beginPath();
 ctx.ellipse(3,7,12,8,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#2455ed";
 ctx.fillRect(-9,-9,18,21);

 ctx.fillStyle="#e5ad83";
 ctx.beginPath();
 ctx.arc(0,-13,9,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#222";
 ctx.fillRect(-7,-18,14,4);

 ctx.restore();
}

// Keyboard
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e")toggleCar();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// Mobile buttons
document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[k]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  btn.addEventListener(ev,()=>keys[k]=false);
 });
});
document.getElementById("action").onclick=toggleCar;

function toggleCar(){
 if(car){
  player.x=car.x+40;
  player.y=car.y;
  player.a=car.a;
  car.speed=0;
  car=null;
 }else{
  let nearest=null,d=65;
  for(const c of cars){
   let distance=Math.hypot(c.x-player.x,c.y-player.y);
   if(distance<d){d=distance;nearest=c;}
  }
  if(nearest)car=nearest;
 }
}

// Movement
function update(){
 let speed=player.speed;

 if(car){
  if(keys.w||keys.arrowup)car.speed+=0.25;
  if(keys.s||keys.arrowdown)car.speed-=0.25;
  car.speed*=0.97;
  car.speed=Math.max(-6,Math.min(9,car.speed));

  if(keys.a||keys.arrowleft)car.a-=0.045;
  if(keys.d||keys.arrowright)car.a+=0.045;

  car.x+=Math.sin(car.a)*car.speed;
  car.y-=Math.cos(car.a)*car.speed;

  car.x=Math.max(15,Math.min(world.w-15,car.x));
  car.y=Math.max(15,Math.min(world.h-15,car.y));

  player.x=car.x;
  player.y=car.y;
 }else{
  let dx=0,dy=0;
  if(keys.w||keys.arrowup)dy-=1;
  if(keys.s||keys.arrowdown)dy+=1;
  if(keys.a||keys.arrowleft)dx-=1;
  if(keys.d||keys.arrowright)dx+=1;

  if(dx||dy){
   let l=Math.hypot(dx,dy);
   player.x+=dx/l*speed;
   player.y+=dy/l*speed;
  }
  player.x=Math.max(10,Math.min(world.w-10,player.x));
  player.y=Math.max(10,Math.min(world.h-10,player.y));
 }

 document.getElementById("mode").innerText=car?"Driving":"Walking";
 document.getElementById("speed").innerText=car?
 Math.round(Math.abs(car.speed)*10):"0";

 camera.x=player.x-canvas.width/2;
 camera.y=player.y-canvas.height/2;
 camera.x=Math.max(0,Math.min(world.w-canvas.width,camera.x));
 camera.y=Math.max(0,Math.min(world.h-canvas.height,camera.y));
}

function draw(){
 ctx.fillStyle="#548d49";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.save();
 ctx.translate(-camera.x,-camera.y);

 // Grass
 ctx.fillStyle="#548d49";
 ctx.fillRect(0,0,world.w,world.h);

 // Roads
 for(const r of roads){
  ctx.fillStyle="#333438";
  ctx.fillRect(r.x,r.y,r.w,r.h);

  ctx.strokeStyle="#eee";
  ctx.lineWidth=2;
  ctx.setLineDash([18,18]);

  if(r.w<r.h){
   ctx.beginPath();
   ctx.moveTo(r.x+r.w/2,r.y);
   ctx.lineTo(r.x+r.w/2,r.y+r.h);
  }else{
   ctx.beginPath();
   ctx.moveTo(r.x,r.y+r.h/2);
   ctx.lineTo(r.x+r.w,r.y+r.h/2);
  }
  ctx.stroke();
  ctx.setLineDash([]);
 }

 // Trees
 for(const t of trees){
  ctx.fillStyle="#654321";
  ctx.fillRect(t.x-3,t.y,6,12);
  ctx.fillStyle="#176b35";
  ctx.beginPath();
  ctx.arc(t.x,t.y, t.r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#298b3e";
  ctx.beginPath();
  ctx.arc(t.x-5,t.y-4,t.r*0.55,0,Math.PI*2);
  ctx.fill();
 }

 // Buildings
 for(const b of buildings)drawBuilding(b);

 // Cars
 for(const c of cars)drawCar(c);

 // Player
 if(!car)drawPlayer();

 ctx.restore();

 // Minimap
 const mw=140,mh=140;
 ctx.fillStyle="#111d";
 ctx.fillRect(canvas.width-mw-15,15,mw,mh);
 ctx.fillStyle="#666";
 ctx.fillRect(canvas.width-mw-10,20,mw-10,mh-10);
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(
  canvas.width-mw/2-15+
  (player.x/world.w)*(mw-15),
  20+(player.y/world.h)*(mh-10),
  4,0,Math.PI*2
 );
 ctx.fill();
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
