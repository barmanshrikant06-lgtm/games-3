
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Fire Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    display: block;
    background: #718c54;
}

.hud {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.panel {
    background: #111c;
    padding: 12px;
    border: 1px solid #ffffff55;
    border-radius: 8px;
}

.guns {
    position: absolute;
    bottom: 20px;
    right: 15px;
    display: flex;
    gap: 10px;
}

button {
    padding: 13px 18px;
    background: #e99b19;
    color: black;
    border: 2px solid white;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    background: white;
}

.controls {
    position: absolute;
    bottom: 20px;
    left: 15px;
    display: grid;
    grid-template-columns: repeat(3, 50px);
    gap: 5px;
}

.controls button {
    padding: 12px;
    touch-action: none;
}

#shoot {
    position: absolute;
    right: 20px;
    bottom: 100px;
    background: #e53935;
    color: white;
    border-radius: 50%;
    width: 75px;
    height: 75px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="hud">
    <div class="panel">
        ❤️ Health: <span id="health">100</span>
    </div>
    <div class="panel">
        🔫 Gun: <span id="gunName">AK47</span>
    </div>
    <div class="panel">
        🎯 Score: <span id="score">0</span>
    </div>
</div>

<div class="controls">
    <button data-key="up">⬆️</button>
    <button data-key="up">W</button>
    <button> </button>
    <button data-key="left">⬅️</button>
    <button data-key="down">⬇️</button>
    <button data-key="right">➡️</button>
</div>

<button id="shoot">FIRE</button>

<div class="guns">
    <button onclick="changeGun('AK47')">AK47</button>
    <button onclick="changeGun('MP40')">MP40</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

let player = {
    x: 250,
    y: 250,
    size: 22,
    speed: 4
};

let keys = {};
let gun = "AK47";
let score = 0;
let targets = [];

function changeGun(name) {
    gun = name;
    document.getElementById("gunName").innerText = name;
}

function building(x, y, w, h, color) {
    ctx.fillStyle = "#263128";
    ctx.fillRect(x + 7, y + 7, w, h);

    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = "#4b4b4b";
    ctx.fillRect(x, y, w, 12);

    for(let i = 15; i < w - 10; i += 35) {
        ctx.fillStyle = "#8ac6dc";
        ctx.fillRect(x + i, y + 25, 18, 22);
    }

    ctx.fillStyle = "#333";
    ctx.fillRect(x + w/2 - 12, y + h - 30, 24, 30);
}

function drawMap() {
    ctx.fillStyle = "#78965b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Roads
    ctx.fillStyle = "#777";
    ctx.fillRect(0, canvas.height/2 - 45,
                 canvas.width, 90);

    ctx.strokeStyle = "#eee";
    ctx.setLineDash([25, 20]);
    ctx.beginPath();
    ctx.moveTo(0, canvas.height/2);
    ctx.lineTo(canvas.width, canvas.height/2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Buildings
    building(40, 60, 130, 110, "#aa7953");
    building(250, 40, 150, 125, "#a3a3a3");
    building(480, 65, 140, 115, "#96704f");
    building(700, 45, 145, 125, "#9b9b9b");

    building(40, 370, 145, 125, "#a58c6b");
    building(270, 390, 150, 115, "#777");
    building(510, 375, 140, 130, "#ad805a");
}

function drawGun() {
    ctx.save();
    ctx.translate(player.x + 8, player.y);

    if(gun === "AK47") {
        ctx.fillStyle = "#262626";
        ctx.fillRect(0, -5, 48, 10);
        ctx.fillStyle = "#9a6338";
        ctx.fillRect(8, -10, 18, 7);
        ctx.fillRect(18, 5, 10, 14);
        ctx.fillStyle = "#111";
        ctx.fillRect(40, -3, 16, 6);
    } else {
        ctx.fillStyle = "#252525";
        ctx.fillRect(0, -6, 36, 12);
        ctx.fillStyle = "#555";
        ctx.fillRect(8, -12, 15, 6);
        ctx.fillStyle = "#111";
        ctx.fillRect(12, 5, 10, 16);
    }

    ctx.restore();
}

function drawPlayer() {
    ctx.fillStyle = "#174cba";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#ffcc99";
    ctx.beginPath();
    ctx.arc(player.x, player.y - 17, 10, 0, Math.PI*2);
    ctx.fill();

    drawGun();
}

function createTarget() {
    targets.push({
        x: Math.random() * (canvas.width - 100) + 50,
        y: Math.random() * (canvas.height - 150) + 70,
        size: 13
    });
}

for(let i = 0; i < 5; i++) createTarget();

function drawTargets() {
    targets.forEach(t => {
        ctx.fillStyle = "#ffcc00";
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "#222";
        ctx.lineWidth = 3;
        ctx.stroke();
    });
}

function shoot() {
    if(targets.length === 0) return;

    let nearest = -1;
    let distance = Infinity;

    targets.forEach((t, i) => {
        let d = Math.hypot(t.x-player.x, t.y-player.y);
        if(d < distance) {
            distance = d;
            nearest = i;
        }
    });

    if(nearest !== -1 && distance < 300) {
        targets.splice(nearest, 1);
        score += gun === "AK47" ? 10 : 15;
        document.getElementById("score").innerText = score;
        createTarget();
    }
}

document.getElementById("shoot").addEventListener("click", shoot);

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

document.querySelectorAll("[data-key]").forEach(btn => {
    let key = btn.dataset.key;

    btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
    });

    ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
        btn.addEventListener(event, () => keys[key] = false);
    });
});

function update() {
    if(keys["w"] || keys["arrowup"] || keys["up"])
        player.y -= player.speed;

    if(keys["s"] || keys["arrowdown"] || keys["down"])
        player.y += player.speed;

    if(keys["a"] || keys["arrowleft"] || keys["left"])
        player.x -= player.speed;

    if(keys["d"] || keys["arrowright"] || keys["right"])
        player.x += player.speed;

    player.x = Math.max(25, Math.min(canvas.width-25, player.x));
    player.y = Math.max(25, Math.min(canvas.height-25, player.y));
}

function loop() {
    update();
    drawMap();
    drawTargets();
    drawPlayer();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
